name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_VERSION: 0.8.6
  LLVM_COV_VERSION: 0.9.2
  AUDIT_VERSION: 0.22.2

jobs:
  database:
    name: Database tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the environment file
        run: .github/write-env.sh

      # pg_dump refuses to dump a server newer than itself, and the
      # consolidated DDL is generated with it
      - name: Install the PostgreSQL 17 client
        run: .github/install-pg-client.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache sqlx-cli
        id: sqlx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_VERSION }}-${{ runner.os }}

      - name: Install sqlx-cli
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: |
          cargo install sqlx-cli \
            --version "$SQLX_VERSION" \
            --no-default-features --features rustls,postgres \
            --locked

      - name: Start the database
        run: make db-up

      - name: Apply every migration
        run: make migrate

      # The reverse path is tested rather than assumed. One enumerated type
      # keeps two values it cannot drop, which 0009 states, so the check is that
      # no relation and no routine is left behind
      - name: Revert every migration and reapply
        run: .github/check-reverse-path.sh

      - name: Create the roles and load the data
        run: make roles seed

      - name: Run the integrity tests
        run: make test

      - name: Report data quality findings and audit the privileges
        run: make verify

      # Both are generated from the live schema, so a migration committed
      # without regenerating them leaves the repository describing a schema that
      # does not exist
      - name: Check the generated DDL and data dictionary are current
        run: |
          make ddl dictionary
          git diff --exit-code -- db/ddl/schema.sql docs/data-dictionary.md

  api:
    name: API tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      # The committed query data is what lets the crate build without a
      # database, so it is checked before one is started
      - name: Build without a database
        run: cargo build --locked
        working-directory: api
        env:
          SQLX_OFFLINE: true

      - name: Check the formatting
        run: cargo fmt --check
        working-directory: api

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: api
        env:
          SQLX_OFFLINE: true

      - name: Write the environment file
        run: .github/write-env.sh

      - name: Cache sqlx-cli
        id: sqlx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_VERSION }}-${{ runner.os }}

      - name: Install sqlx-cli
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: |
          cargo install sqlx-cli \
            --version "$SQLX_VERSION" \
            --no-default-features --features rustls,postgres \
            --locked

      - name: Start the database and load the fixture
        run: make db-up migrate roles seed

      # Includes the test that fails when docs/api/openapi.yaml is stale
      - name: Run the tests
        run: make api-test

      - name: Cache the coverage and audit tools
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-audit
          key: api-tools-${{ env.LLVM_COV_VERSION }}-${{ env.AUDIT_VERSION }}-${{ runner.os }}

      - name: Install the coverage and audit tools
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-llvm-cov --version "$LLVM_COV_VERSION" --locked
          cargo install cargo-audit --version "$AUDIT_VERSION" --locked

      # The threshold is the quality gate, so a change that drops coverage below
      # it fails here rather than being noticed later
      - name: Measure the test coverage
        run: make api-coverage

      # The exceptions in api/.cargo/audit.toml state why each is not in the
      # build graph
      - name: Audit the dependencies
        run: make api-audit

  openapi:
    name: API specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the specification
        run: make openapi-lint

  web:
    name: Browser application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the dependencies
        run: npm ci
        working-directory: web

      - name: Lint, format and type-check
        run: make web-check

      - name: Run the unit tests
        run: make web-test

      # Both projects in the Playwright configuration are Chromium, the phone
      # one through device emulation, so no other browser is downloaded
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      # The demo build answers from the committed fixtures, so these need
      # neither the API nor a database
      - name: Run the end to end tests
        run: make web-e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

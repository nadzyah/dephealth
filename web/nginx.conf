server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The hashed assets are immutable, so they can be cached forever. index.html
    # cannot, or a deployment would not reach anyone still holding the old one
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A single page application owns its routing, so an address the server does
    # not recognise is the application's to resolve rather than a 404. This is
    # what makes a pasted report link work on a cold open
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
